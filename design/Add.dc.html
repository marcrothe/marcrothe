<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hinzufügen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap">
<style>
@font-face{font-family:"HN Black Ext";src:url("/_blob/49b7dff1c66c64469fceeac303f95824") format("opentype");font-weight:800 900;font-style:normal;font-display:swap}
body{margin:0;background:#000}
a{color:#8a8a99}a:hover{color:#FF123E}
button{font:inherit}
input::placeholder{color:#3a3a44}
@keyframes stepIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.stepIn{animation:stepIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both}
@keyframes popIn{0%{opacity:0;transform:scale(0.8)}100%{opacity:1;transform:scale(1)}}
.popIn{animation:popIn 0.45s cubic-bezier(0.25, 1.35, 0.4, 1) both}
@keyframes scanSweep{0%{background-position:0 100%}100%{background-position:0 0%}}
.scanSweep{animation:scanSweep 1.2s ease-in-out infinite}
@keyframes glSwing{0%{transform:translateX(-54px)}100%{transform:translateX(6px)}}
@keyframes glJig{0%{transform:rotate(1.2deg) translateX(-24px)}100%{transform:rotate(-1.2deg) translateX(-24px)}}
.wheel{scrollbar-width:none;-ms-overflow-style:none}
.wheel::-webkit-scrollbar{display:none}
@keyframes rowOpen{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.rowOpen{animation:rowOpen 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both}
@keyframes ctxWiggle{0%{transform:perspective(900px) rotateY(-7deg)}100%{transform:perspective(900px) rotateY(7deg)}}
.plateSwing{transform-origin:50% 50%;animation:ctxWiggle 1.8s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate}
.plateGloss{animation:glSwing 1.8s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate}
@keyframes collapseOut{0%{opacity:1;transform:none;filter:blur(0)}100%{opacity:0;transform:translateY(-70px) scale(0.86, 0.35);filter:blur(5px)}}
.collapseOut{animation:collapseOut 0.45s cubic-bezier(0.55, 0, 0.75, 0.2) forwards}
@keyframes celebBg{0%{opacity:0}100%{opacity:1}}
.celebBg{animation:celebBg 0.35s ease both}
@keyframes celebFly{0%{opacity:0;transform:translateY(-360px) scale(0.45) rotate(-6deg)}12%{opacity:1}68%{transform:translateY(14px) scale(1.07) rotate(1deg)}84%{transform:translateY(-5px) scale(0.985) rotate(0deg)}100%{opacity:1;transform:none}}
.celebFly{animation:celebFly 1.1s cubic-bezier(0.22, 0.9, 0.3, 1) 0.05s both}
@keyframes celebSwing{0%{transform:perspective(1000px) rotateY(0deg);animation-timing-function:ease-out}25%{transform:perspective(1000px) rotateY(7deg);animation-timing-function:ease-in-out}75%{transform:perspective(1000px) rotateY(-7deg);animation-timing-function:ease-in}100%{transform:perspective(1000px) rotateY(0deg)}}
.celebSwing{transform-origin:50% 50%;animation:celebSwing 3.6s 2.9s infinite}
@keyframes celebHalo{0%{opacity:0;transform:scale(0.3) rotate(0deg)}40%{opacity:0.55}100%{opacity:0.32;transform:scale(1) rotate(120deg)}}
@keyframes haloSpin{0%{transform:rotate(120deg)}100%{transform:rotate(480deg)}}
.celebHalo{opacity:0;animation:celebHalo 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.85s forwards, haloSpin 14s linear 2.25s infinite}
@keyframes spark{0%{opacity:0;transform:translate(-50%, -50%) scale(0.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1)}}
.spark{position:absolute;left:50%;top:50%;border-radius:999px;opacity:0;pointer-events:none;animation:spark 1s cubic-bezier(0.12, 0.75, 0.3, 1) both}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes checkPop{0%{opacity:0;transform:scale(0.2)}100%{opacity:1;transform:scale(1)}}
.checkPop{animation:checkPop 0.45s cubic-bezier(0.25, 1.6, 0.4, 1) 1.15s both}
@keyframes starPopA{0%{transform:scale(0.6) rotate(-30deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes starPopB{0%{transform:scale(0.6) rotate(-30deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0deg)}}
.starPopA{animation:starPopA 0.45s cubic-bezier(0.3, 1.5, 0.5, 1)}
.starPopB{animation:starPopB 0.45s cubic-bezier(0.3, 1.5, 0.5, 1)}
.celebText{animation:fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s both}
.celebBtns{animation:fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1.5s both}
@media (prefers-reduced-motion: reduce){.stepIn,.popIn,.scanSweep,.rowOpen,.plateSwing,.plateGloss,.collapseOut,.celebFly,.celebSwing,.spark,.celebText,.celebBtns,.celebBg{animation:none}.celebHalo{animation:none;opacity:0.3}}
</style>
</helmet>

<div data-addroot="1" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; color: #ffffff; font-family: 'Work Sans', sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 28px 20px 4px; min-height: 40px">
<h1 style="margin: 0; font-family: 'HN Black Ext', sans-serif; font-weight: 900; font-size: 26px; line-height: 1; letter-spacing: -0.01em; color: #ffffff">{{pageTitle}}</h1>
<sc-if value="{{showPhotoBtn}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{startPhoto}}" style="flex: none; min-height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 16px 0 13px; border-radius: 999px; background: rgba(44, 44, 52, 0.62); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 0.5px solid rgba(255, 255, 255, 0.18); color: #ffffff; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Work Sans', sans-serif; font-size: 15px; font-weight: 500">
<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M3.5 17L9.5 12.5L13 15L16 13L20.5 16.5"></path></svg>
Aus Foto</button>
</sc-if>
<sc-if value="{{showCancel}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{cancel}}" style="flex: none; min-height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(44, 44, 52, 0.62); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 0.5px solid rgba(255, 255, 255, 0.18); color: #ffffff; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Work Sans', sans-serif; font-size: 15px; font-weight: 500">Abbrechen</button>
</sc-if>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 8px 20px 130px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Work Sans', sans-serif">

<sc-if value="{{isPhotos}}" hint-placeholder-val="{{false}}">
<div class="stepIn" style="display: flex; flex-direction: column; gap: 14px; padding-top: 12px">
<p style="margin: 0; font-size: 13px; color: #8a8a99">Wähle ein Foto deiner Startnummer.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{photos}}" as="ph" hint-placeholder-count="9">
<button type="button" onClick="{{ph.pick}}" aria-label="{{ph.label}}" style="position: relative; aspect-ratio: 1; padding: 0; border: 0; overflow: hidden; background: {{ph.bg}}; cursor: {{ph.cur}}">
<sc-if value="{{ph.isBib}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 50%; top: 50%; width: 92px; line-height: 0; transform: translate(-50%, -50%) rotate(-7deg); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45)">
<dc-import name="Bib" which="kh" w="92" custom="{{true}}" num="H5718" hint-size="92px,78px"></dc-import>
</span>
</sc-if>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isScan}}" hint-placeholder-val="{{false}}">
<div class="stepIn" style="display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 30px">
<div style="position: relative; width: 300px; height: 300px; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, #5d6b78, #2a3138)">
<span style="position: absolute; left: 50%; top: 50%; width: 220px; line-height: 0; transform: translate(-50%, -50%) rotate(-7deg); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5)">
<dc-import name="Bib" which="kh" w="220" custom="{{true}}" num="H5718" hint-size="220px,187px"></dc-import>
</span>
<span class="scanSweep" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0) 60%, rgba(255,255,255,0) 100%); background-size: 100% 260%"></span>
</div>
<p role="status" style="margin: 0; font-size: 15px; color: #8a8a99">Wird erkannt …</p>
</div>
</sc-if>

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px; padding-top: 6px">

<div style="height: 186px; display: flex; align-items: center; justify-content: center; opacity: {{prevOp}}">
<sc-if value="{{hasBib}}" hint-placeholder-val="{{false}}">
<button type="button" data-prev="1" onClick="{{flipPrev}}" aria-label="Vorschau, antippen zum Umdrehen" class="popIn" style="padding: 0; border: 0; background: transparent; cursor: pointer; line-height: 0">
<div class="plateSwing">
<dc-import name="Bib" which="{{bibId}}" w="{{bibW}}" custom="{{true}}" num="{{bibNum}}" runner="{{bibName}}" time="{{bibTime}}" flipped="{{prevFlip}}" swing="{{true}}" fav="{{prevFav}}" hint-size="200px,170px"></dc-import>
</div>
</button>
</sc-if>
<sc-if value="{{noBib}}" hint-placeholder-val="{{true}}">
<div class="popIn" style="line-height: 0">
<div class="plateSwing">
<svg viewBox="0 0 108 76" width="200" role="img" aria-label="Noch kein Lauf gewählt" style="display: block">
<defs>
<mask id="gpMask" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="76"><rect width="108" height="76" rx="2.4" fill="#fff"></rect><circle cx="5.5" cy="5.5" r="1.9" fill="#000"></circle><circle cx="102.5" cy="5.5" r="1.9" fill="#000"></circle><circle cx="5.5" cy="70.5" r="1.9" fill="#000"></circle><circle cx="102.5" cy="70.5" r="1.9" fill="#000"></circle></mask>
<linearGradient id="gpFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.12"></stop><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0.09"></stop></linearGradient>
<linearGradient id="gpGloss" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="86" y2="34"><stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient>
<linearGradient id="gpEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.42"></stop><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0.3"></stop></linearGradient>
<linearGradient id="gpBand" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="86" y2="34"><stop offset="0.3" stop-color="#000000"></stop><stop offset="0.5" stop-color="#ffffff"></stop><stop offset="0.7" stop-color="#000000"></stop></linearGradient>
<mask id="gpEdgeMask" maskUnits="userSpaceOnUse" x="-4" y="-4" width="116" height="84"><rect x="-108" y="-76" width="324" height="228" fill="url(#gpBand)" class="plateGloss" style="transform-box: view-box; transform-origin: 54px 38px; transform: translateX(-24px)"></rect></mask>
</defs>
<g mask="url(#gpMask)">
<rect width="108" height="76" fill="url(#gpFill)"></rect>
<rect x="-108" y="-76" width="324" height="228" fill="url(#gpGloss)" class="plateGloss" style="transform-box: view-box; transform-origin: 54px 38px; transform: translateX(-24px)"></rect>
</g>
<g fill="none" stroke="url(#gpEdge)" stroke-width="0.4"><rect x="0.2" y="0.2" width="107.6" height="75.6" rx="2.3"></rect><circle cx="5.5" cy="5.5" r="1.9"></circle><circle cx="102.5" cy="5.5" r="1.9"></circle><circle cx="5.5" cy="70.5" r="1.9"></circle><circle cx="102.5" cy="70.5" r="1.9"></circle></g>
<g fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.45" mask="url(#gpEdgeMask)"><rect x="0.2" y="0.2" width="107.6" height="75.6" rx="2.3"></rect><circle cx="5.5" cy="5.5" r="1.9"></circle><circle cx="102.5" cy="5.5" r="1.9"></circle><circle cx="5.5" cy="70.5" r="1.9"></circle><circle cx="102.5" cy="70.5" r="1.9"></circle></g>
</svg>
</div>
</div>
</sc-if>
</div>

<div class="{{formCls}}" style="overflow: hidden; border-radius: 16px; background: #111114; border: 0.5px solid rgba(255, 255, 255, 0.08); transform-origin: 50% 0">

<button type="button" onClick="{{dateTap}}" style="width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border: 0; border-top: {{dateBt}}; background: transparent; color: #ffffff; cursor: {{dateCur}}; opacity: {{dateOp}}; font-family: inherit; font-size: 16px; text-align: left; transition: opacity 0.25s ease">
<span style="flex: none; color: {{lockLbl}}">Datum</span>
<span style="min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: flex-end">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{dateColor}}">{{dateVal}}</span>
<sc-if value="{{dateHasTag}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #8a8a99; font-size: 11px; font-weight: 500">{{dateTag}}</span>
</sc-if>
</span>
</button>
<sc-if value="{{dateOpen}}" hint-placeholder-val="{{false}}">
<div class="rowOpen" style="position: relative; display: flex; justify-content: center; gap: 4px; padding: 6px 12px 12px; border-top: 0.5px solid rgba(255, 255, 255, 0.08)">
<span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 78px; height: 36px; border-radius: 9px; background: rgba(255, 255, 255, 0.08); pointer-events: none"></span>
<sc-for list="{{dateCols}}" as="wc" hint-placeholder-count="3">
<div class="wheel" data-wheel="{{wc.key}}" onScroll="{{wc.onScroll}}" role="listbox" aria-label="{{wc.aria}}" style="position: relative; width: {{wc.w}}px; height: 180px; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 32%, #000 68%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 32%, #000 68%, transparent 100%)">
<div style="height: 72px"></div>
<sc-for list="{{wc.items}}" as="wi" hint-placeholder-count="5">
<button type="button" role="option" aria-selected="{{wi.sel}}" onClick="{{wi.pick}}" style="width: 100%; height: 36px; display: flex; align-items: center; justify-content: {{wc.align}}; padding: 0 8px; border: 0; background: transparent; scroll-snap-align: center; color: {{wi.color}}; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Work Sans', sans-serif; font-size: 21px; font-variant-numeric: tabular-nums; transition: color 0.15s ease">{{wi.label}}</button>
</sc-for>
<div style="height: 72px"></div>
</div>
</sc-for>
</div>
</sc-if>

<button type="button" onClick="{{raceTap}}" style="width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border: 0; border-top: {{raceBt}}; background: transparent; color: #ffffff; cursor: {{raceCur}}; opacity: {{raceOp}}; font-family: inherit; font-size: 16px; text-align: left; transition: opacity 0.25s ease">
<span style="flex: none; color: {{lockLbl}}">Lauf</span>
<span style="min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: flex-end">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{raceColor}}">{{raceVal}}</span>
<sc-if value="{{raceHasTag}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #8a8a99; font-size: 11px; font-weight: 500">{{raceTag}}</span>
</sc-if>
</span>
</button>
<sc-if value="{{raceOpen}}" hint-placeholder-val="{{false}}">
<div class="rowOpen" style="border-top: 0.5px solid rgba(255, 255, 255, 0.08)">
<sc-if value="{{hasRaces}}" hint-placeholder-val="{{true}}">
<sc-for list="{{races}}" as="ra" hint-placeholder-count="1">
<button type="button" onClick="{{ra.pick}}" style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 8px 16px 8px 20px; border: 0; border-top: {{ra.bt}}; background: rgba(255, 255, 255, 0.02); color: #ffffff; cursor: pointer; font-family: inherit; text-align: left">
<span style="flex: none; width: 52px; line-height: 0"><dc-import name="Bib" which="{{ra.id}}" w="52" hint-size="52px,44px"></dc-import></span>
<span style="min-width: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{ra.name}}</span>
<span style="font-size: 13px; color: #8a8a99">{{ra.sub}}</span>
</span>
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#FF123E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; opacity: {{ra.chk}}"><path d="M5 12.5L10 17.5L19 7"></path></svg>
</button>
</sc-for>
</sc-if>
<sc-if value="{{noRaces}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 14px 20px 4px; font-size: 14px; color: #8a8a99">An diesem Tag kennen wir noch keinen Lauf.</p>
</sc-if>
<button type="button" style="width: 100%; min-height: 44px; padding: 0 20px; border: 0; background: transparent; color: #FF123E; cursor: pointer; font-family: inherit; font-size: 15px; text-align: left">Lauf nicht dabei? Vorlage anfragen</button>
</div>
</sc-if>

<button type="button" onClick="{{distTap}}" style="width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border: 0; border-top: {{distBt}}; background: transparent; color: #ffffff; cursor: {{distCur}}; opacity: {{distOp}}; font-family: inherit; font-size: 16px; text-align: left; transition: opacity 0.25s ease">
<span style="flex: none; color: {{lockLbl}}">Strecke</span>
<span style="min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: flex-end">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{distColor}}">{{distVal}}</span>
<sc-if value="{{distHasTag}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #8a8a99; font-size: 11px; font-weight: 500">{{distTag}}</span>
</sc-if>
</span>
</button>
<sc-if value="{{distOpen}}" hint-placeholder-val="{{false}}">
<div class="rowOpen" style="border-top: 0.5px solid rgba(255, 255, 255, 0.08)">
<sc-for list="{{dists}}" as="di" hint-placeholder-count="3">
<button type="button" onClick="{{di.pick}}" style="width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 8px 20px; border: 0; border-top: {{di.bt}}; background: rgba(255, 255, 255, 0.02); color: #ffffff; cursor: pointer; font-family: inherit; font-size: 15px; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span>{{di.label}}</span><span style="font-size: 12px; color: #8a8a99">{{di.sub}}</span></span>
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#FF123E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; opacity: {{di.chk}}"><path d="M5 12.5L10 17.5L19 7"></path></svg>
</button>
</sc-for>
</div>
</sc-if>

<label style="width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; box-sizing: border-box; border-top: 0.5px solid rgba(255, 255, 255, 0.08); opacity: {{numOp}}; pointer-events: {{numPe}}; font-size: 16px; transition: opacity 0.25s ease">
<span style="flex: none">Startnummer</span>
<span style="min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<span style="display: flex; align-items: baseline; justify-content: flex-end">
<span style="color: #8a8a99">{{prefix}}</span>
<input type="text" inputmode="numeric" autocomplete="off" aria-label="Startnummer" placeholder="{{numPh}}" value="{{numDigits}}" onChange="{{onNum}}" onFocus="{{toFront}}" style="width: {{numW}}ch; border: 0; outline: none; background: transparent; color: #ffffff; font: inherit; text-align: right; padding: 0">
</span>
<sc-if value="{{numHasTag}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #8a8a99; font-size: 11px; font-weight: 500">erkannt</span>
</sc-if>
</span>
</label>

<label style="width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; box-sizing: border-box; border-top: 0.5px solid rgba(255, 255, 255, 0.08); opacity: {{nameOp}}; font-size: 16px; transition: opacity 0.25s ease">
<span style="flex: none">Name</span>
<sc-if value="{{nameEditable}}" hint-placeholder-val="{{false}}">
