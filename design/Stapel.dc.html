<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap">
<style>

body{margin:0;background:#000}
a{color:#8a8a99}a:hover{color:#FF123E}
button{font:inherit}
@keyframes holoSweep{0%{background-position:130% 0;opacity:0}12%{opacity:1}80%{opacity:1}100%{background-position:-30% 0;opacity:0}}
.plain{color:#8a8a99}
.holotext{color:transparent;background-image:linear-gradient(100deg,#ffffff 0%,#e3f4fc 14%,#ffffff 26%,#ece4ff 38%,#ffffff 50%,#dcfff6 62%,#ffffff 74%,#ffe6f3 86%,#ffffff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;transition:background-position 0.25s ease-out}
@keyframes menuPop{0%{opacity:0;transform:scale(0.55)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.menuIn{animation:menuPop 0.32s cubic-bezier(0.25, 1.35, 0.4, 1) both}
@keyframes ctxFade{from{opacity:0}to{opacity:1}}
@keyframes ctxLift{0%{transform:scale(0.96)}100%{transform:scale(1.08)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,14px) scale(0.96)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.ctxFade{animation:ctxFade 0.25s ease both}
.ctxLift{animation:ctxLift 0.4s cubic-bezier(0.25, 1.35, 0.4, 1) both}
@keyframes glSwing{0%{transform:translateX(-54px)}100%{transform:translateX(6px)}}
@keyframes glJig{0%{transform:rotate(1.2deg) translateX(-24px)}100%{transform:rotate(-1.2deg) translateX(-24px)}}
@keyframes ctxWiggle{0%{transform:perspective(900px) rotateY(-7deg)}100%{transform:perspective(900px) rotateY(7deg)}}
.ctxWiggle{transform-origin:50% 50%;animation:ctxWiggle 1.8s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate}
.toastIn{transform:translateX(-50%);animation:toastIn 0.32s cubic-bezier(0.25, 1.35, 0.4, 1) both}
@keyframes editIn{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
.editIn{animation:editIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both}
@keyframes editOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(60px) scale(0.96)}}
.editOut{animation:editOut 0.3s ease-in forwards}

.savedPop{animation:savedPop 0.6s cubic-bezier(0.25, 1.35, 0.4, 1) both}

</helmet>
<div data-ctxroot="1" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; color: #ffffff; font-family: 'Work Sans', sans-serif; overflow: hidden">

<header style="display: flex; flex-direction: column; gap: 4px; padding: 28px 20px 4px">

</button>
</div>
<p style="margin: 0; min-height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: #8a8a99">Wischen zum Blättern, hochziehen für Favorit</p>

</span>

</sc-if>
</button>
</sc-for>

</div>

<svg viewBox="0 0 24 24" width="14" height="14" aria-label="Favorit" style="flex: none; display: block; margin-right: 6px; transform: scale({{starS}}) rotate({{starR}}deg); transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1)"><defs><linearGradient id="stStarG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f4fc"></stop><stop offset=".35" stop-color="#ffffff"></stop><stop offset=".65" stop-color="#ece4ff"></stop><stop offset="1" stop-color="#dcfff6"></stop></linearGradient></defs><path d="M12 3.5L14.6 9L20.5 9.6L16 13.6L17.3 19.5L12 16.5L6.7 19.5L8 13.6L3.5 9.6L9.4 9Z" fill="url(#stStarG)" stroke="url(#stStarG)" stroke-width="2" stroke-linejoin="miter"></path></svg>
</span>
<span style="position: relative; display: inline-block; font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap">
<span style="color: #8a8a99; opacity: {{plainO}}; transition: opacity 0.45s ease">{{line}}</span>
<span class="holotext" aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: {{holoO}}; transition: opacity 0.45s ease, background-position 0.25s ease-out; background-position: {{shine}}% 0">{{line}}</span>
</span>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 22px">
<button type="button" onClick="{{prev}}" aria-label="Vorherige Startnummer" style="width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: #8a8a99; cursor: pointer; padding: 0">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5L8 12L15 19"></path></svg>
</button>
<div style="display: flex; gap: 8px" aria-label="{{count}}">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<span style="width: 8px; height: 8px; background: {{d.bg}}; transition: background 0.2s ease"></span>
</sc-for>
</div>
<button type="button" onClick="{{next}}" aria-label="Nächste Startnummer" style="width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: #8a8a99; cursor: pointer; padding: 0">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M9 5L16 12L9 19"></path></svg>
</button>
</div>
</main>

<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="15" height="11" rx="1.5"></rect><path d="M7 5H19.5A1.5 1.5 0 0 1 21 6.5V15"></path></svg>

<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect></svg>

<a href="Erfolge.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 999px; color: #d6d6de; text-decoration: none; font-size: 10px; font-weight: 600">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H16V9A4 4 0 0 1 8 9Z"></path><path d="M8 6H5V7A3 3 0 0 0 8 10"></path><path d="M16 6H19V7A3 3 0 0 1 16 10"></path><path d="M12 13V17M8 20H16M10 17H14"></path></svg>

<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20C5.5 16.5 8.5 15 12 15C15.5 15 18.5 16.5 20 20"></path></svg>
Profil</a>

<sc-if value="{{ctxOn}}" hint-placeholder-val="{{false}}">
<div onPointerUp="{{ctxUp}}" onPointerCancel="{{ctxUp}}" style="position: absolute; inset: 0; z-index: 80">
<button type="button" onClick="{{closeCtx}}" aria-label="Menü schließen" class="ctxFade" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: default"></button>
<div aria-hidden="true" class="ctxLift" style="position: absolute; left: {{ctxX}}px; top: {{ctxY}}px; width: {{ctxW}}px; line-height: 0; pointer-events: none; filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.6))">
<div class="ctxWiggle">
<dc-import name="Bib" which="{{ctxId}}" w="{{ctxW}}" flipped="{{ctxFlipped}}" fav="{{ctxFav}}" shine="{{shine}}" swing="{{true}}" custom="{{ctxCustom}}" num="{{ctxNum}}" runner="{{ctxRunner}}" time="{{ctxTime}}" hint-size="150px,106px"></dc-import>

</div>

<span>{{a.label}}</span>
<svg viewBox="0 0 24 24" width="20" height="20" fill="{{a.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{a.d}}"></path></svg>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{undoOn}}" hint-placeholder-val="{{false}}">
<div role="status" class="toastIn" style="position: absolute; left: 50%; bottom: 104px; z-index: 70; display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; white-space: nowrap; border-radius: 999px; background: rgba(44, 44, 52, 0.62); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 0.5px solid rgba(255, 255, 255, 0.18); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Work Sans', sans-serif; font-size: 15px">
<span style="color: #ffffff">Startnummer gelöscht</span>
<button type="button" onClick="{{undo}}" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.13); color: #FF123E; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600">Rückgängig</button>
</div>
</sc-if>

<sc-if value="{{editOn}}" hint-placeholder-val="{{false}}">
<div class="{{editCls}}" style="position: absolute; inset: 0; z-index: 90; background: #000000">
<dc-import name="Add" seed="{{editSeed}}" done-cb="{{doneCb}}" cancel-cb="{{cancelCb}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
